name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd my-devops-app
          git pull
          sudo docker stop myapp || true
          sudo docker rm myapp || true
          sudo docker build -t myapp .
          sudo docker run -d -p 80:3000 --name myapp myapp